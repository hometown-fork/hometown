        setting_boost_modal: වැඩි කිරීමට පෙර තහවුරු කිරීමේ සංවාදය පෙන්වන්න
        setting_missing_alt_text_modal: විකල්ප පෙළ නොමැතිව මාධ්‍ය පළ කිරීමට පෙර තහවුරු කිරීමේ සංවාදය පෙන්වන්න.
